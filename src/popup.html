<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRIM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px; color: #101418; background: #e9edf1;
  }
  .bar {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; background: #fff; border-bottom: 1px solid #c3ccd5;
  }
  .bar b { font-size: 16px; font-weight: 600; }
  .ver {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: .1em; color: #6b7783;
    border: 1px solid #c3ccd5; border-radius: 2px; padding: 2px 6px;
  }
  .lang { margin-left: auto; display: flex; border: 1px solid #c3ccd5; border-radius: 3px; overflow: hidden; }
  .lang button { padding: 5px 9px; border: 0; background: #fff; font: inherit; font-size: 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #101418; color: #fff; }

  .hint { padding: 10px 14px; background: #f6f8fa; border-bottom: 1px solid #dde3e9; color: #3d4852; line-height: 1.55; }
  kbd {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    background: #e9edf1; border: 1px solid #c3ccd5; border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px;
  }
  .sec { padding: 11px 14px; }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sec-head h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #6b7783; }
  .pill {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    background: #fff; border: 1px solid #c3ccd5; border-radius: 10px; padding: 1px 7px; color: #3d4852;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; background: #fff; color: #101418;
    border: 1px solid #c3ccd5; border-radius: 3px;
    font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .btn:hover { background: #f3f6f9; border-color: #6b7783; }
  .btn-primary { background: #101418; color: #fff; border-color: #101418; }
  .btn-primary:hover { background: #26313b; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .list { display: flex; flex-direction: column; gap: 7px; max-height: 260px; overflow: auto; }
  .card { background: #fff; border: 1px solid #dde3e9; border-radius: 3px; padding: 9px 10px; }
  .card .top { display: flex; gap: 8px; align-items: baseline; }
  .card .ttl { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .when { margin-left: auto; color: #6b7783; font-size: 11.5px; white-space: nowrap; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 2px; border: 1.5px solid #6b7783; }
  .empty { color: #6b7783; padding: 6px 0; }
  .foot { padding: 9px 14px 12px; color: #8b959f; font-size: 11px; line-height: 1.5; }
  .foot a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .foot a:hover { color: #3d4852; }
</style>
</head>
<body>

<div class="bar">
  <b>TRIM</b><span class="ver">v0.72 · local</span>
  <div class="lang"><button data-lang="de" aria-pressed="false">DE</button><button data-lang="en" aria-pressed="true">EN</button></div>
</div>

<div class="hint" id="hint"></div>

<div class="sec">
  <div class="actions">
    <button class="btn btn-primary" id="btn-capture"></button>
    <button class="btn" id="btn-shortcut"></button>
  </div>
</div>

<div class="sec" style="padding-top:0">
  <div class="sec-head">
    <h2 id="lbl-sessions"></h2>
    <span class="pill" id="count">0</span>
  </div>
  <div class="list" id="list"></div>
  <div class="actions" style="margin-top:9px">
    <button class="btn" id="btn-export"></button>
    <button class="btn" id="btn-clear"></button>
  </div>
</div>

<div class="foot" id="foot"></div>

<script src="model.js"></script>
<script src="popup.js"></script>
</body>
</html>
